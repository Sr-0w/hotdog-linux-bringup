# Minimal hardware-validated speaker and microphone routes for the
# OnePlus 7T Pro
#
# Playback is MultiMedia1 on PCM 0, capture is MultiMedia2 on PCM 1. They must
# stay on separate front ends: a capture stream is only openable once its front
# end is joined to SLIMBUS_0_TX, and a sound server probes the PCM before it
# applies any use-case sequence, so sharing one PCM makes the whole card fail
# to probe rather than just the microphone.
#
# The capture chain follows the OxygenOS odm "amic4" path: the handset
# microphone sits on the AMIC4 pad, which is selected on the shared AMIC4_5
# mux, feeds ADC4, reaches decimator 0, and is exposed on SLIM TX0.
#
# AMIC4 needs MIC BIAS1, not MIC BIAS4. With the wrong supply the pad captures
# nothing, which is what made this look like the wrong pad at first. The stock
# overlay labels AMIC5 as the handset microphone, but on this handset AMIC5 is
# silent while AMIC1, AMIC3 and AMIC4 all capture; the odm mixer path, which
# names amic4, matches the hardware.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='AMIC4_5 SEL' AMIC4"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	SupportedDevice [
		"Mic"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# DisplayPort audio over USB-C. It shares front end MultiMedia1 with the
# speakers -- the same PCM 0 -- and only the back end differs, so the two are
# mutually exclusive and each sequence hands the front end over rather than
# adding a second sink.
#
# The verb leaves the speaker mixer on, so enabling this device has to turn it
# off first; otherwise both back ends take the same stream and the phone keeps
# playing alongside the monitor.
SectionDevice."HDMI" {
	Comment "DisplayPort"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	SupportedDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC4"
		cset "name='ADC4 Volume' 20"
		cset "name='DEC0 Volume' 96"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC4 Volume' 0"
		cset "name='DEC0 Volume' 84"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
