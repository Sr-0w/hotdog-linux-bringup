# Minimal hardware-validated speaker and microphone routes for the
# OnePlus 7T Pro
#
# Playback is MultiMedia1 on PCM 0, capture is MultiMedia2 on PCM 1. They must
# stay on separate front ends: a capture stream is only openable once its front
# end is joined to SLIMBUS_0_TX, and a sound server probes the PCM before it
# applies any use-case sequence, so sharing one PCM makes the whole card fail
# to probe rather than just the microphone.
#
# The capture chain follows the OxygenOS odm "amic5" path: the handset
# microphone sits on the AMIC5 pad, which is selected on the shared AMIC4_5
# mux, feeds ADC4, reaches decimator 0, and is exposed on SLIM TX0. AMIC4 is
# an ANC input on the same mux, so selecting it yields a running but silent
# capture.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='AMIC4_5 SEL' AMIC5"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC4"
		cset "name='ADC4 Volume' 20"
		cset "name='DEC0 Volume' 108"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC4 Volume' 0"
		cset "name='DEC0 Volume' 84"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
