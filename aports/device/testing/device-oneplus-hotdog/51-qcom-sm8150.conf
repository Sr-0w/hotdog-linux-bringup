# SM8150 Q6ASM uses a 16-bit frontend for the validated HiFi routes.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*\\.HiFi.*__sink"
      }
      {
        node.name = "~alsa_input.*\\.HiFi.*__source"
      }
    ]
    actions = {
      update-props = {
        audio.format         = "S16LE"
        audio.rate           = 48000
        api.alsa.disable-batch = true
        api.alsa.period-size = 4096
        api.alsa.period-num  = 6
        api.alsa.headroom    = 512
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
